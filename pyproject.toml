[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tierguard"
version = "1.0.0.0"
description = "Trusted-edge robust aggregation experiments for hierarchical federated learning."
readme = "README.md"
requires-python = "==3.12.*"
license = {file = "LICENSE"}
authors = [
  {name = "Rajan Mani"},
  {name = "Surmila Thokchom"},
  {name = "Sarsij Tripathi"},
  {name = "Ashish Pandey"},
]
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "numpy==2.3.5",
  "scipy==1.18.0",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "matplotlib==3.11.0",
  "tqdm==4.68.3",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "joblib==1.5.3",
]

[project.scripts]
tierguard = "tierguard.cli:main"

[project.urls]
Repository = "https://github.com/Devchandrasen/TierGuard"
Issues = "https://github.com/Devchandrasen/TierGuard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
