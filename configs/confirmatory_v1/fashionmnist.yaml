experiment:
  name: tierguard_confirmatory_v1
  device: cpu
  rounds: 30
  eval_every: 1
federated:
  num_clients: 20
  num_edges: 5
  clients_per_round: 10
  local_epochs: 2
  batch_size: 64
  client_lr: 0.05
  server_lr: 1.0
  client_optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
data:
  dataset: fashionmnist
  synthetic: false
  download: true
  root: ./data
  partition: dirichlet
  dirichlet_alpha: 0.5
  iid: false
  train_size: 6000
  test_size: 1000
  validation_size: 1000
  root_dataset_size: 500
model:
  name: mnist_cnn
attack:
  target_label: 0
  source_label: 1
  scale: 3.0
  backdoor_trigger: bottom_right_square
  backdoor_fraction: 0.3
aggregation:
  trim_beta: 0.2
privacy:
  enabled: false
security:
  secure_sim: false
tierguard:
  clip_multiplier: 4.0
  gamma: 0.5
  adaptive_gamma: true
  min_gamma_scale: 0.15
  tau_low: 0.75
  tau_high: 0.90
  trim_beta: 0.2
  score_mode: relative
  score_margin: 0.05
  score_scale_floor: 0.10
  absolute_suspicion_cutoff: 0.90
  z_norm_cap: 6.0
  cosine_weight: 1.0
  norm_weight: 1.0
  sign_weight: 0.35
  sign_sample_size: 4096
  use_root_direction: true
  use_edge_reliability: true
  fallback: geometric_median
  min_reliability: 0.20
  root_norm_multiplier: 1.0
  root_cap_mode: suspect_only
  root_cap_suspicion: 0.65
  root_cap_z: 2.0
  use_backdoor_audit: true
  audit_gamma: 12.0
  audit_margin: 0.02
  audit_min_risk: 0.0
  audit_weight_floor: 0.50
  audit_batch_size: 64
