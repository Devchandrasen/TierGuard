experiment:
  name: tierguard_main
  seed: 1
  device: cuda
  rounds: 100
  eval_every: 1
  save_every: 10
  fast_dev_run: false

federated:
  num_clients: 100
  num_edges: 10
  clients_per_round: 20
  local_epochs: 1
  batch_size: 64
  client_lr: 0.01
  server_lr: 1.0
  client_optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001

data:
  dataset: fashionmnist
  synthetic: false
  root: ./data
  partition: dirichlet
  dirichlet_alpha: 0.3
  iid: false
  root_dataset_size: 200
  validation_size: 5000
  train_size: null
  test_size: null
  csv_path: null
  label_column: label

model:
  name: mnist_cnn

attack:
  name: none
  malicious_fraction: 0.0
  target_label: 0
  source_label: 1
  scale: 1.0
  sigma: 1.0
  alie_z: 1.0
  backdoor_trigger: bottom_right_square
  backdoor_fraction: 0.3
  lambda_backdoor: 1.0

aggregation:
  method: tierguard
  krum_f: null
  trim_beta: 0.2

privacy:
  enabled: false
  dp_noise_multiplier: 0.0
  clipping_norm: 5.0
  delta: 1e-5
  accountant: rdp

security:
  secure_sim: true
  quantization_bits: 16
  field_bits: 64
  edge_committee_size: 3
  edge_threshold: 2
  cloud_committee_size: 5
  cloud_threshold: 3
  dropout_fraction: 0.0

tierguard:
  clip_multiplier: 4.0
  gamma: 1.0
  adaptive_gamma: true
  min_gamma_scale: 0.15
  tau_low: 0.65
  tau_high: 0.85
  trim_beta: 0.2
  score_mode: relative
  score_margin: 0.05
  score_scale_floor: 0.10
  absolute_suspicion_cutoff: 0.90
  z_norm_cap: 6.0
  cosine_weight: 1.0
  norm_weight: 1.0
  sign_weight: 0.35
  sign_sample_size: 4096
  use_root_direction: true
  use_edge_reliability: true
  fallback: geometric_median
  min_reliability: 0.20
  root_norm_multiplier: 0.75
  root_cap_mode: suspect_only
  root_cap_suspicion: 0.65
  root_cap_z: 2.5
  use_backdoor_audit: true
  audit_gamma: 6.0
  audit_margin: 0.04
  audit_min_risk: 0.01
  audit_weight_floor: 0.50
  audit_batch_size: 64
